name: Deploy portal LMS SATUSEHAT (pratinjau)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: lms-pages
  cancel-in-progress: false
jobs:
  validate:
    name: Validate static preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify source manifest and static assets
        run: node site/validate.cjs
      - name: Exercise learner catalog interactions
        run: node site/test.cjs
      - name: Verify 51 active and 5 held resources in UAT export
        run: node site/uat-links.cjs > /tmp/satusehat-uat-links.csv
  package:
    name: Package approved public-preview allowlist
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage explicit allowlist of public files
        run: |
          mkdir -p dist
          cp site/index.html site/style.css site/app.js site/modules.json site/robots.txt dist/
          touch dist/.nojekyll
          test "$(find dist -type f | wc -l)" -eq 6
      - name: Upload only participant preview files (never QA scripts or source archives)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    name: Deploy to GitHub Pages
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
