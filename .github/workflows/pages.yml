name: Deploy portal LMS SATUSEHAT (pratinjau)
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lms-pages
  cancel-in-progress: false
jobs:
  validate:
    name: Validate static preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify source manifest and static assets
        run: node site/validate.cjs
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only preview files (never source archives)
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
