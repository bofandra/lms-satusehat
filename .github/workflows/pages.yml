name: Deploy LMS SATUSEHAT v0.7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Verify LMS release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild and verify LMS release
        shell: bash
        run: |
          set -euo pipefail
          cat release/part-*.b64 | base64 -d > /tmp/lms-satusehat-v0.7.zip
          echo "d6b58102df204af4e8f510fe49d4c547355482cb63c40f12f080155559efdea0  /tmp/lms-satusehat-v0.7.zip" | sha256sum -c -
          unzip -q /tmp/lms-satusehat-v0.7.zip -d .
          python3 scripts/validate_release.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

  deploy:
    name: Deploy live site
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
